<!doctype html>
<meta charset="utf-8">
<title>pixel-guard</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 0;
    background: #222b36; color: #dde5ee;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex; flex-direction: column; height: 100vh;
  }
  .head { padding: 12px 14px; border-bottom: 1px solid #34424f; font-family: Inter, system-ui, sans-serif; }
  .head h4 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .stat { display: flex; justify-content: space-between; margin: 3px 0; color: #b9c6d4; }
  .stat code { color: #8fb5da; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: #7fb08a; } .dot.off { background: #c98b8b; }
  .hint { margin-top: 8px; padding: 7px 8px; border-radius: 6px; background: #1a222b;
          color: #b9c6d4; font-size: 11px; line-height: 1.4; }
  .hint b { color: #dde5ee; }
  .vp { padding: 10px 14px; border-bottom: 1px solid #34424f; font-family: Inter, system-ui, sans-serif; }
  .vp-row { display: flex; gap: 4px; }
  .vp-btn { flex: 1; padding: 5px 4px; border: 1px solid #34424f; border-radius: 5px;
            background: #1a222b; color: #b9c6d4; font-size: 11px; cursor: pointer; }
  .vp-btn.on { background: #7ba7d4; color: #16202a; border-color: #7ba7d4; font-weight: 600; }
  .ovl { padding: 10px 14px; border-bottom: 1px solid #34424f; font-family: Inter, system-ui, sans-serif; }
  .ovl-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 11px; color: #b9c6d4; }
  .ovl-row input[type=range] { flex: 1; accent-color: #7ba7d4; }
  .ovl-row input[type=number] { width: 58px; background: #1a222b; color: #dde5ee; border: 1px solid #3a4756; border-radius: 4px; padding: 3px 5px; }
  .ovl-row select { background: #1a222b; color: #dde5ee; border: 1px solid #3a4756; border-radius: 4px; padding: 3px 5px; }
  .ovl-note { font-size: 10px; color: #6f7f8f; margin-top: 4px; }
  .audit { padding: 10px 14px; border-bottom: 1px solid #34424f; font-family: Inter, system-ui, sans-serif; }
  .audit button { width: 100%; padding: 7px; border: 0; border-radius: 6px; background: #7ba7d4;
                  color: #16202a; font-weight: 600; font-size: 12px; cursor: pointer; }
  .arow { padding: 6px 0; border-bottom: 1px solid #2b3642; cursor: pointer; }
  .arow:hover { background: #1a222b; }
  .arow .nm { font-family: Inter, system-ui, sans-serif; font-size: 12px; }
  .arow .sl { color: #8fb5da; font-size: 11px; word-break: break-all; }
  .arow .st { float: right; font-size: 11px; }
  .arow.pass .st { color: #9ec9a8; } .arow.failed .st { color: #e8a0a0; }
  .arow.missing .st, .arow.nofig .st { color: #d4b483; }
  .arow.skip { opacity: .55; }
  .bind { padding: 10px 14px; border-bottom: 1px solid #34424f; font-family: Inter, system-ui, sans-serif; }
  .bind-row { display: flex; gap: 6px; }
  .bind select { flex: 1; background: #1a222b; color: #dde5ee; border: 1px solid #3a4756;
                 border-radius: 5px; padding: 5px; font-size: 11px; }
  .bind button { padding: 5px 10px; border: 0; border-radius: 5px; background: #7ba7d4;
                 color: #16202a; font-weight: 600; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .bind button.ghost { width: 100%; margin-top: 6px; background: #34424f; color: #dde5ee; font-weight: 400; }
  .body { flex: 1; overflow: auto; padding: 12px 14px; }
  .empty { color: #6f7f8f; font-size: 11px; }
  .node { margin-bottom: 4px; font-size: 13px; font-family: Inter, system-ui, sans-serif; }
  .sel { margin: 4px 0 8px; color: #8fb5da; word-break: break-all; }
  .score { margin: 0 0 8px; color: #b9c6d4; }
  .note { margin: 6px 0; color: #d4b483; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 2px 4px 2px 0; vertical-align: top; }
  tr.ok td { color: #9ec9a8; }
  tr.no td { color: #e8a0a0; }
  .log { border-top: 1px solid #34424f; padding: 8px 14px; max-height: 110px; overflow: auto;
         color: #6f7f8f; font-size: 11px; }
  .log div { margin: 2px 0; }
</style>
<div class="head">
  <h4>pixel-guard</h4>
  <div class="stat"><span><span class="dot off" id="dot"></span><span id="state">сервер недоступен</span></span></div>
  <div class="stat"><span>плагин Figma</span><code id="figma">—</code></div>
  <div class="stat"><span>нод в карте</span><code id="mapn">0</code></div>
  <div class="hint" id="hint"></div>
</div>
<div class="vp">
  <div class="vp-row">
    <button class="vp-btn on" data-vp="auto">авто</button>
    <button class="vp-btn" data-vp="desktop">ПК</button>
    <button class="vp-btn" data-vp="tablet">планшет</button>
    <button class="vp-btn" data-vp="mobile">телефон</button>
  </div>
  <label class="ovl-row" style="margin:6px 0 0"><input type="checkbox" id="vp-resize" checked> менять ширину окна</label>
  <div class="ovl-note" id="vp-note"></div>
</div>
<div class="ovl">
  <label class="ovl-row"><input type="checkbox" id="ov-on"> наложить макет</label>
  <div class="ovl-row"><input type="range" id="ov-op" min="0" max="100" value="50"><span id="ov-val">50%</span></div>
  <div class="ovl-row">
    <select id="ov-mode">
      <option value="render">макет (цвета, текст)</option>
      <option value="shots">PNG по блокам (пиксель)</option>
      <option value="image">картинка PNG (весь макет)</option>
      <option value="outline">только рамки</option>
    </select>
    <label><input type="checkbox" id="ov-diff"> difference</label>
  </div>
  <div class="ovl-row">
    <span>сдвиг X</span><input type="number" id="ov-x" value="0" step="10">
    <span>Y</span><input type="number" id="ov-y" value="0" step="10">
    <label><input type="checkbox" id="ov-scale" checked> авто-масштаб</label>
    <label><input type="checkbox" id="ov-solo"> только макет</label>
    <label><input type="checkbox" id="ov-loose"> непривязанные</label>
  </div>
  <label class="ovl-row"><input type="checkbox" id="ov-split-on"> шторка (макет слева / сайт справа)</label>
  <div class="ovl-row"><input type="range" id="ov-split" min="0" max="100" value="50" disabled><span id="ov-split-val">50%</span></div>
  <div class="ovl-note" id="ov-note"></div>
</div>
<div class="bind" id="bind" hidden>
  <div class="bind-row">
    <select id="bind-page" title="в какую карту писать"></select>
    <button id="bind-go">Привязать мышью</button>
  </div>
  <button id="bind-skip" class="ghost">Пометить skip</button>
  <div class="ovl-note" id="bind-note"></div>
</div>
<div class="audit">
  <button id="run-audit">Проверить страницу</button>
  <div class="ovl-note" id="audit-note"></div>
</div>
<div class="body" id="body"><div class="empty">Кликни ноду в Figma — здесь появится сверка.</div></div>
<div class="log" id="log"></div>
<script src="panel.js"></script>
