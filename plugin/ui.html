<style>
  * { box-sizing: border-box; }
  body { font: 13px/1.45 Inter, system-ui, sans-serif; margin: 0; padding: 14px;
         color: #dde5ee; background: #1a222b; }

  .hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .hdr b { font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4a5766; flex: none; }
  .dot.on { background: #7fb08a; }
  .hdr span.st { margin-left: auto; font-size: 11px; color: #6f7f8f; }

  button { width: 100%; padding: 9px; border: 0; border-radius: 7px;
           background: #7ba7d4; color: #16202a; font-weight: 600; font-size: 12px; cursor: pointer; }
  button.alt { background: #2b3642; color: #dde5ee; font-weight: 500; margin-top: 6px; }
  button:disabled { opacity: .4; cursor: default; }

  .live { display: flex; align-items: center; gap: 7px; margin: 12px 0 0;
          padding: 9px 10px; background: #222b36; border-radius: 7px; font-size: 12px; cursor: pointer; }
  .live small { margin-left: auto; color: #6f7f8f; font-size: 10px; }

  details { margin-top: 10px; }
  summary { font-size: 11px; color: #6f7f8f; cursor: pointer; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: #b9c6d4; }
  .row select, .row input[type=number] {
    background: #222b36; color: #dde5ee; border: 1px solid #34424f;
    border-radius: 5px; padding: 5px 6px; font-size: 11px; }
  .row select { flex: 1; }
  .row input[type=number] { width: 72px; }
  .chk { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11px;
         color: #b9c6d4; cursor: pointer; }

  .sel { margin-bottom: 12px; padding: 10px; background: #222b36; border-radius: 7px; }
  .sel-name { font-size: 12px; font-weight: 600; margin-bottom: 3px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sel-id { font: 11px ui-monospace, Menlo, monospace; color: #8fb5da;
            user-select: all; cursor: text; word-break: break-all; }
  .sel-btns { display: flex; gap: 5px; margin-top: 8px; }
  button.mini { width: auto; flex: 1; padding: 5px 6px; font-size: 11px; font-weight: 500;
                background: #34424f; color: #dde5ee; }
  button.mini.done { background: #7fb08a; color: #16202a; }

  #log { margin-top: 12px; padding: 9px 10px; min-height: 56px; background: #222b36;
         border-radius: 7px; white-space: pre-wrap; word-break: break-word;
         font: 11px/1.5 ui-monospace, Menlo, monospace; color: #9ec9a8; }
  #log.err { color: #e8a0a0; }
</style>

<div class="hdr">
  <span class="dot" id="bus-dot"></span>
  <b>pixel-guard</b>
  <span class="st" id="bus-state">живой режим выключен</span>
</div>

<div class="sel" id="sel" hidden>
  <div class="sel-name" id="sel-name"></div>
  <div class="sel-id" id="sel-id"></div>
  <div class="sel-btns">
    <button class="mini" id="cp-id">id</button>
    <button class="mini" id="cp-mcp">для агента</button>
    <button class="mini" id="cp-curl">curl PNG</button>
  </div>
</div>

<button id="go">Снять выделенные frame'ы</button>
<button id="goall" class="alt">Снять весь проект</button>
<button id="save" class="alt" disabled>Скачать JSON</button>

<label class="live"><input id="live" type="checkbox" checked> живой режим
  <small>клик по ноде → браузер</small></label>

<details>
  <summary>настройки подключения</summary>
  <div class="row">
    <select id="mode">
      <option value="auto">авто</option>
      <option value="https">HTTPS (Figma в браузере)</option>
      <option value="http">HTTP (Figma Desktop)</option>
      <option value="download">только скачать файл</option>
    </select>
    <input id="port" type="number" value="8971">
  </div>
  <label class="chk"><input id="png" type="checkbox"> экспортировать PNG (тяжелее)</label>
</details>

<div id="log">Выдели frame(’ы) на канвасе и жми «Снять».</div>
<script>
  const isWeb = location.protocol === 'https:' || parent !== window && /figma\.com$/.test(document.referrer.split('/')[2] || '');
  const el = (id) => document.getElementById(id);
  const log = (t, err) => { const l = el('log'); l.textContent = t; l.className = err ? 'err' : ''; };
  const btn = el('go');
  const saveBtn = el('save');
  let lastFrames = null;

  const resolveMode = () => {
    const m = el('mode').value;
    return m === 'auto' ? (isWeb ? 'https' : 'http') : m;
  };

  const download = (frames) => {
    const blob = new Blob([JSON.stringify({ frames }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = frames.length === 1 ? `${frames[0].frameName.replace(/[^\wЀ-ӿ-]+/g, '-')}.pg.json` : 'snapshot.pg.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    log(`Скачан ${a.download}.\nПоложи его в snapshots/ и распакуй:\n  npm run import -- <файл>`);
  };

  saveBtn.onclick = () => { if (lastFrames) download(lastFrames); };

  el('goall').onclick = () => {
    btn.disabled = true;
    log('Обхожу все страницы проекта…');
    parent.postMessage({ pluginMessage: {
      type: 'export-project',
      port: +el('port').value || 8971,
      png: el('png').checked,
      mode: resolveMode(),
    } }, '*');
  };

  btn.onclick = () => {
    btn.disabled = true;
    log('Собираю дерево нод…');
    parent.postMessage({ pluginMessage: {
      type: 'export',
      port: +el('port').value || 8971,
      png: el('png').checked,
      mode: resolveMode(),
    } }, '*');
  };

  const busBase = () => {
    const tls = resolveMode() === 'https';
    const port = (+el('port').value || 8971) + (tls ? 1 : 0);
    return `${tls ? 'https' : 'http'}://localhost:${port}`;
  };

  let bus = null;
  let busRetry = 0;
  let busTimer = null;
  let lastBeat = 0;
  let watchdog = null;

  const busStatus = (t, err) => {
    el('bus-state').textContent = t;
    el('bus-state').style.color = err ? '#e8a0a0' : '#6f7f8f';
    el('bus-dot').className = 'dot' + (!err && /подключ|на связи/i.test(t) ? ' on' : '');
  };

  const connectBus = () => {
    if (bus) { bus.close(); bus = null; }
    const base = busBase();
    bus = new EventSource(`${base}/bus?role=figma`);

    bus.addEventListener('hello', () => {
      busRetry = 0;
      lastBeat = Date.now();
      busStatus(`на связи · ${base}`);
      log(`живой режим: подключён к ${base}`);
    });
    bus.addEventListener('peers', (e) => {
      lastBeat = Date.now();
      const p = JSON.parse(e.data);
      busStatus(`на связи · браузер ${p.extension ? 'да' : 'нет'}`);
    });
    bus.addEventListener('beat', () => { lastBeat = Date.now(); });
    bus.addEventListener('render', (e) => {
      lastBeat = Date.now();
      const req = JSON.parse(e.data);
      log(`рендер: ${req.id} (${req.format || 'PNG'})…`);
      fetch(`${busBase()}/render-ack`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reqId: req.reqId }),
      }).catch(() => {});
      parent.postMessage({ pluginMessage: { type: 'render-request', ...req } }, '*');
    });
    bus.addEventListener('find', (e) => {
      lastBeat = Date.now();
      const req = JSON.parse(e.data);
      parent.postMessage({ pluginMessage: { type: 'find-node', ...req } }, '*');
    });

    // EventSource в iframe плагина умеет отвалиться молча — переподключаемся сами
    bus.onerror = () => {
      if (!el('live').checked) return;
      busRetry++;
      const wait = Math.min(15000, 1000 * busRetry);
      busStatus(`нет связи, переподключаюсь через ${Math.round(wait / 1000)}с (попытка ${busRetry})`, true);
      clearTimeout(busTimer);
      busTimer = setTimeout(connectBus, wait);
    };
  };

  const setLive = (on) => {
    clearTimeout(busTimer);
    clearInterval(watchdog);
    if (!on) {
      if (bus) { bus.close(); bus = null; }
      busStatus('живой режим выключен');
      log('живой режим выключен');
      return;
    }
    busRetry = 0;
    connectBus();
    // если сервер молчит дольше 70с (ping идёт раз в 25с) — соединение мертво
    watchdog = setInterval(() => {
      if (!el('live').checked || !lastBeat) return;
      if (Date.now() - lastBeat > 70000) {
        busStatus('связь потеряна, переподключаюсь…', true);
        lastBeat = Date.now();
        connectBus();
      }
    }, 15000);
  };

  // Выделенная нода: id под рукой + копирование в форматах, которые
  // сразу вставляются агенту или в терминал.
  let selNode = null;

  const showSelection = (n) => {
    selNode = n;
    el('sel').hidden = false;
    el('sel-name').textContent = n.name || n.figmaId;
    const size = n.w != null ? ` · ${Math.round(n.w)}×${Math.round(n.h)}` : '';
    el('sel-id').textContent = n.figmaId + size;
  };

  const copy = async (btn, text) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      const was = btn.textContent;
      btn.textContent = 'скопировано';
      btn.classList.add('done');
      setTimeout(() => { btn.textContent = was; btn.classList.remove('done'); }, 1200);
    } catch (e) {
      log(`не смог скопировать: ${e}`, true);
    }
  };

  el('cp-id').onclick = (e) => selNode && copy(e.target, selNode.figmaId);
  el('cp-mcp').onclick = (e) => selNode && copy(e.target,
    `нода Figma ${selNode.figmaId} («${selNode.name}»). `
    + `Стили: figma_get_node_styles({ id: "${selNode.figmaId}" }). `
    + `Картинка: figma_render_node({ id: "${selNode.figmaId}" }).`);
  el('cp-curl').onclick = (e) => selNode && copy(e.target,
    `curl -o node.png "${busBase()}/render?id=${encodeURIComponent(selNode.figmaId)}&scale=2"`);

  el('live').onchange = (e) => setLive(e.target.checked);
  // живой режим включён по умолчанию — сразу поднимаем связь с сервером
  if (el('live').checked) setLive(true);

  onmessage = async (e) => {
    const msg = e.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'selection') {
      showSelection(msg.node);
      if (!el('live').checked) return;
      try {
        const r = await fetch(`${busBase()}/emit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ event: 'select', payload: msg.node, to: 'extension' }),
        });
        const j = await r.json();
        log(j.sent ? `→ ${msg.node.name} (в браузер)` : `→ ${msg.node.name}: браузер не подключён`);
      } catch (err) {
        log(`живой режим: сервер недоступен (${err})`, true);
      }
      return;
    }
    if (msg.type === 'render-done' || msg.type === 'find-done') {
      try {
        await fetch(`${busBase()}/render-result`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(msg),
        });
        log(msg.error ? `рендер: ошибка — ${msg.error}` : `рендер готов: ${msg.result?.name ?? ''}`);
      } catch (err) {
        log(`не отдал результат рендера: ${err}`, true);
      }
      return;
    }
    if (msg.type === 'status') log(msg.text);
    if (msg.type === 'project') {
      lastFrames = [msg.project];
      saveBtn.disabled = false;
      const base = msg.mode === 'https' ? `https://localhost:${msg.port + 1}` : `http://localhost:${msg.port}`;
      log(`Собрано: ${msg.summary}\nОтправляю на ${base}…`);
      if (msg.mode === 'download') { download([msg.project]); btn.disabled = false; return; }
      try {
        const r = await fetch(`${base}/ingest`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ project: msg.project }),
        });
        const j = await r.json();
        log(r.ok ? `Готово: ${msg.summary}\n${j.saved.join('\n')}` : `Сервер ответил ${r.status}`, !r.ok);
      } catch (err) {
        log(`Не достучался до ${base}: ${err}.\nЗапусти npm run server или жми «Скачать JSON».`, true);
      }
      btn.disabled = false;
      return;
    }
    if (msg.type === 'error') { log(msg.text, true); btn.disabled = false; }
    if (msg.type === 'payload') {
      lastFrames = msg.frames;
      saveBtn.disabled = false;
      const bpInfo = msg.frames
        .map((f) => {
          const bp = (f.breakpoints || []).map((b) => `${b.viewport} ${b.width}px`).join(', ');
          return bp ? `${f.frameName}: ${bp}` : null;
        })
        .filter(Boolean)
        .join('\n');
      const mode = msg.mode;
      if (mode === 'download') { download(msg.frames); btn.disabled = false; return; }
      const tls = mode === 'https';
      const port = tls ? msg.port + 1 : msg.port;
      const scheme = tls ? 'https' : 'http';
      const bases = [`${scheme}://localhost:${port}`];
      const body = JSON.stringify({ frames: msg.frames });
      let lastErr = null;
      for (const base of bases) {
        log(`Отправляю ${msg.frames.length} frame(’ов) на ${base}…`);
        try {
          const r = await fetch(`${base}/ingest`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body,
          });
          const j = await r.json();
          log(
            r.ok
              ? `Готово:\n${j.saved.join('\n')}${bpInfo ? `\n\nБрейкпоинты:\n${bpInfo}` : ''}`
              : `Сервер ответил ${r.status}: ${JSON.stringify(j)}`,
            !r.ok
          );
          lastErr = null;
          break;
        } catch (err) {
          lastErr = err;
        }
      }
      if (lastErr) {
        log(
          tls
            ? `Не достучался до ${bases.join(' и ')}: ${lastErr}.\n1) запусти: npm run server\n2) открой ${bases[0]}/ping и прими самоподписанный сертификат\n3) или жми «Скачать JSON»`
            : `Не достучался до ${bases.join(' и ')}: ${lastErr}.\nЗапусти: npm run server (или переключи режим на HTTPS/скачивание)`,
          true
        );
      }
      btn.disabled = false;
    }
  };
</script>
