<style>
  * { box-sizing: border-box; }
  body { font: 13px/1.45 Inter, system-ui, sans-serif; margin: 0; padding: 14px;
         color: #dcdfe3; background: #17191c; }


  button { width: 100%; padding: 9px; border: 0; border-radius: 7px;
           background: #8b939c; color: #15171a; font-weight: 600; font-size: 12px; cursor: pointer; }
  button.alt { background: #2a2e33; color: #dcdfe3; font-weight: 500; }
  button:disabled { opacity: .4; cursor: default; }

  .live { display: flex; align-items: center; gap: 6px; margin: 0 0 10px;
          padding: 9px 10px; background: #1f2226; border-radius: 7px; font-size: 12px; cursor: pointer; }
  .live input { position: absolute; opacity: 0; pointer-events: none; }
  .sw { position: relative; width: 30px; height: 17px; flex: none; border-radius: 9px;
        background: #33383e; transition: background .15s; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
               border-radius: 50%; background: #71767d; transition: transform .15s, background .15s; }
  .live input:checked + .sw { background: #4a5f4e; }
  .live input:checked + .sw::after { transform: translateX(13px); background: #7fb08a; }
  .live input:focus-visible + .sw { outline: 2px solid #8b939c; outline-offset: 2px; }
  .live input:checked + .sw.live-err { background: #5a3f3f; }
  .live input:checked + .sw.live-err::after { background: #e8a0a0; }

  .live small { margin-left: auto; color: #71767d; font-size: 10px; text-align: right;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }

  details { margin-top: 10px; }
  summary { font-size: 11px; color: #71767d; cursor: pointer; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: #a8aeb6; }
  .row select, .row input[type=number] {
    background: #1f2226; color: #dcdfe3; border: 1px solid #33383e;
    border-radius: 5px; padding: 5px 6px; font-size: 11px; }
  .row select { flex: 1; }
  .row input[type=number] { width: 72px; }
  .chk { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11px;
         color: #a8aeb6; cursor: pointer; }

  .sel[hidden] { display: none; }
  .sel { display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
         padding: 7px 9px; background: #1f2226; border-radius: 7px; }
  .sel-id { flex: 1; min-width: 0; font: 11px ui-monospace, Menlo, monospace; color: #9aa3ad;
            user-select: all; cursor: text;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.mini { width: auto; flex: none; padding: 5px 9px; font-size: 11px; font-weight: 500;
                background: #33383e; color: #dcdfe3; }
  button.mini.done { background: #7fb08a; color: #15171a; }

  .grp { display: flex; align-items: center; gap: 6px; }
  .grp-t { flex: none; font-size: 11px; color: #71767d; }
  .grp button { flex: 1; height: 30px; padding: 0 6px; font-size: 12px;
                line-height: 30px; white-space: nowrap; }

  #log { margin-top: 12px; padding: 9px 10px; min-height: 56px; background: #1f2226;
         border-radius: 7px; white-space: pre-wrap; word-break: break-word;
         font: 11px/1.5 ui-monospace, Menlo, monospace; color: #9ec9a8; }
  #log.err { color: #e8a0a0; }
  #prog { margin-top: 12px; padding: 9px 10px; background: #1f2226; border-radius: 7px; }
  #prog[hidden] { display: none; }
  .prog-top { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: #b9c6d4; }
  .prog-top b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prog-top span { color: #71767d; flex: none; font: 11px ui-monospace, Menlo, monospace; }
  .prog-bar { height: 4px; margin-top: 7px; border-radius: 2px; background: #33383e; overflow: hidden; }
  .prog-bar i { display: block; height: 100%; width: 0; background: #8b939c; border-radius: 2px;
                transition: width .15s; }
</style>

<label class="live"><input id="live" type="checkbox" checked><span class="sw" id="bus-dot"></span>
  Live mode
  <small id="bus-state">off</small></label>

<div class="sel" id="sel" hidden>
  <span class="sel-id" id="sel-id"></span>
  <button class="mini" id="cp-id">copy id</button>
</div>

<div class="grp">
  <span class="grp-t">Capture</span>
  <button id="go">frame</button>
  <button id="goall" class="alt">all</button>
  <button id="save" class="alt" disabled>JSON</button>
</div>

<details>
  <summary>connection settings</summary>
  <div class="row">
    <select id="mode">
      <option value="auto">auto</option>
      <option value="https">HTTPS (Figma in browser)</option>
      <option value="http">HTTP (Figma Desktop)</option>
      <option value="download">download file only</option>
    </select>
    <input id="port" type="number" value="8971">
  </div>
  <label class="chk"><input id="png" type="checkbox"> export PNG (heavier)</label>
</details>

<div id="prog" hidden>
  <div class="prog-top"><b id="prog-stage"></b><span id="prog-n"></span></div>
  <div class="prog-bar"><i id="prog-fill"></i></div>
</div>
<div id="log">Select frame(s) on the canvas and press Capture.</div>
<script>
  const isWeb = location.protocol === 'https:' || parent !== window && /figma\.com$/.test(document.referrer.split('/')[2] || '');
  const el = (id) => document.getElementById(id);
  const log = (t, err) => { const l = el('log'); l.textContent = t; l.className = err ? 'err' : ''; };
  const progress = (p) => {
    if (!p) { el('prog').hidden = true; return; }
    el('prog').hidden = false;
    el('prog-stage').textContent = p.stage;
    el('prog-n').textContent = `${p.done}/${p.total}`;
    el('prog-fill').style.width = `${p.total ? Math.round((p.done / p.total) * 100) : 0}%`;
  };
  const btn = el('go');
  const saveBtn = el('save');
  let lastFrames = null;

  const resolveMode = () => {
    const m = el('mode').value;
    return m === 'auto' ? (isWeb ? 'https' : 'http') : m;
  };

  const download = (frames) => {
    const blob = new Blob([JSON.stringify({ frames }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = frames.length === 1 ? `${frames[0].frameName.replace(/[^\wЀ-ӿ-]+/g, '-')}.pg.json` : 'snapshot.pg.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    log(`Downloaded ${a.download}.\nPut it in snapshots/ and unpack it:\n  npm run import -- <file>`);
  };

  saveBtn.onclick = () => { if (lastFrames) download(lastFrames); };

  el('goall').onclick = () => {
    btn.disabled = true;
    log('Traversing all project pages…');
    parent.postMessage({ pluginMessage: {
      type: 'export-project',
      port: +el('port').value || 8971,
      png: el('png').checked,
      mode: resolveMode(),
    } }, '*');
  };

  btn.onclick = () => {
    btn.disabled = true;
    log('Collecting node tree…');
    parent.postMessage({ pluginMessage: {
      type: 'export',
      port: +el('port').value || 8971,
      png: el('png').checked,
      mode: resolveMode(),
    } }, '*');
  };

  const busBase = () => {
    const tls = resolveMode() === 'https';
    const port = (+el('port').value || 8971) + (tls ? 1 : 0);
    return `${tls ? 'https' : 'http'}://localhost:${port}`;
  };

  let bus = null;
  let busRetry = 0;
  let busTimer = null;
  let lastBeat = 0;
  let watchdog = null;

  const busStatus = (t, err) => {
    el('bus-state').textContent = t.replace(/^live mode:?\s*/i, '');
    el('bus-state').style.color = err ? '#e8a0a0' : '#71767d';
    el('bus-dot').classList.toggle('live-err', !!err);
  };

  const connectBus = () => {
    if (bus) { bus.close(); bus = null; }
    const base = busBase();
    bus = new EventSource(`${base}/bus?role=figma`);

    bus.addEventListener('hello', () => {
      busRetry = 0;
      lastBeat = Date.now();
      busStatus(`connected · ${base}`);
      log(`Live mode: connected to ${base}`);
    });
    bus.addEventListener('peers', (e) => {
      lastBeat = Date.now();
      const p = JSON.parse(e.data);
      busStatus(`connected · browser ${p.extension ? 'yes' : 'no'}`);
    });
    bus.addEventListener('beat', () => { lastBeat = Date.now(); });
    bus.addEventListener('render', (e) => {
      lastBeat = Date.now();
      const req = JSON.parse(e.data);
      log(`Render: ${req.id} (${req.format || 'PNG'})…`);
      fetch(`${busBase()}/render-ack`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reqId: req.reqId }),
      }).catch(() => {});
      parent.postMessage({ pluginMessage: { type: 'render-request', ...req } }, '*');
    });
    bus.addEventListener('find', (e) => {
      lastBeat = Date.now();
      const req = JSON.parse(e.data);
      parent.postMessage({ pluginMessage: { type: 'find-node', ...req } }, '*');
    });

    // EventSource inside the plugin iframe can drop silently, so we reconnect ourselves
    bus.onerror = () => {
      if (!el('live').checked) return;
      busRetry++;
      const wait = Math.min(15000, 1000 * busRetry);
      busStatus(`no connection, reconnecting in ${Math.round(wait / 1000)}s (attempt ${busRetry})`, true);
      clearTimeout(busTimer);
      busTimer = setTimeout(connectBus, wait);
    };
  };

  const setLive = (on) => {
    clearTimeout(busTimer);
    clearInterval(watchdog);
    if (!on) {
      if (bus) { bus.close(); bus = null; }
      busStatus('Live mode off');
      log('Live mode off');
      return;
    }
    busRetry = 0;
    connectBus();
    // if the server stays silent for more than 70s (ping every 25s), the connection is dead
    watchdog = setInterval(() => {
      if (!el('live').checked || !lastBeat) return;
      if (Date.now() - lastBeat > 70000) {
        busStatus('connection lost, reconnecting…', true);
        lastBeat = Date.now();
        connectBus();
      }
    }, 15000);
  };

  // Selected node: id at hand + copying in formats that can be pasted
  // straight to the agent or the terminal.
  let selNode = null;

  const showSelection = (n) => {
    selNode = n;
    el('sel').hidden = false;
    const size = n.w != null ? ` · ${Math.round(n.w)}×${Math.round(n.h)}` : '';
    el('sel-id').textContent = n.figmaId + size;
    el('sel-id').title = `${n.name || ''}\n${n.figmaId}`;
  };

  const copy = async (btn, text) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      const was = btn.textContent;
      btn.textContent = 'copied';
      btn.classList.add('done');
      setTimeout(() => { btn.textContent = was; btn.classList.remove('done'); }, 1200);
    } catch (e) {
      log(`Could not copy: ${e}`, true);
    }
  };

  el('cp-id').onclick = (e) => selNode && copy(e.target, selNode.figmaId);

  el('live').onchange = (e) => setLive(e.target.checked);
  // Live mode is on by default, so connect to the server right away
  if (el('live').checked) setLive(true);

  onmessage = async (e) => {
    const msg = e.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'selection') {
      showSelection(msg.node);
      if (!el('live').checked) return;
      try {
        const r = await fetch(`${busBase()}/emit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ event: 'select', payload: msg.node, to: 'extension' }),
        });
        const j = await r.json();
        log(j.sent ? `→ ${msg.node.name} (to browser)` : `→ ${msg.node.name}: browser not connected`);
      } catch (err) {
        log(`Live mode: server unavailable (${err})`, true);
      }
      return;
    }
    if (msg.type === 'render-done' || msg.type === 'find-done') {
      try {
        await fetch(`${busBase()}/render-result`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(msg),
        });
        log(msg.error ? `Render error: ${msg.error}` : `Render done: ${msg.result?.name ?? ''}`);
      } catch (err) {
        log(`Could not deliver render result: ${err}`, true);
      }
      return;
    }
    if (msg.type === 'status') log(msg.text);
    if (msg.type === 'progress') progress(msg);
    if (msg.type === 'payload' || msg.type === 'project' || msg.type === 'error') progress(null);
    if (msg.type === 'project') {
      lastFrames = [msg.project];
      saveBtn.disabled = false;
      const base = msg.mode === 'https' ? `https://localhost:${msg.port + 1}` : `http://localhost:${msg.port}`;
      log(`Collected: ${msg.summary}\nSending to ${base}…`);
      if (msg.mode === 'download') { download([msg.project]); btn.disabled = false; return; }
      try {
        const r = await fetch(`${base}/ingest`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ project: msg.project }),
        });
        const j = await r.json();
        log(r.ok ? `Done: ${msg.summary}\n${j.saved.join('\n')}` : `Server responded ${r.status}`, !r.ok);
      } catch (err) {
        log(`Could not reach ${base}: ${err}.\nRun npm run server or press "JSON" to download.`, true);
      }
      btn.disabled = false;
      return;
    }
    if (msg.type === 'error') { log(msg.text, true); btn.disabled = false; }
    if (msg.type === 'payload') {
      lastFrames = msg.frames;
      saveBtn.disabled = false;
      const bpInfo = msg.frames
        .map((f) => {
          const bp = (f.breakpoints || []).map((b) => `${b.viewport} ${b.width}px`).join(', ');
          return bp ? `${f.frameName}: ${bp}` : null;
        })
        .filter(Boolean)
        .join('\n');
      const mode = msg.mode;
      if (mode === 'download') { download(msg.frames); btn.disabled = false; return; }
      const tls = mode === 'https';
      const port = tls ? msg.port + 1 : msg.port;
      const scheme = tls ? 'https' : 'http';
      const bases = [`${scheme}://localhost:${port}`];
      const body = JSON.stringify({ frames: msg.frames });
      let lastErr = null;
      for (const base of bases) {
        log(`Sending ${msg.frames.length} frame(s) to ${base}…`);
        try {
          const r = await fetch(`${base}/ingest`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body,
          });
          const j = await r.json();
          log(
            r.ok
              ? `Done:\n${j.saved.join('\n')}${bpInfo ? `\n\nBreakpoints:\n${bpInfo}` : ''}`
              : `Server responded ${r.status}: ${JSON.stringify(j)}`,
            !r.ok
          );
          lastErr = null;
          break;
        } catch (err) {
          lastErr = err;
        }
      }
      if (lastErr) {
        log(
          tls
            ? `Could not reach ${bases.join(' and ')}: ${lastErr}.\n1) run: npm run server\n2) open ${bases[0]}/ping and accept the self-signed certificate\n3) or press "JSON" to download`
            : `Could not reach ${bases.join(' and ')}: ${lastErr}.\nRun: npm run server (or switch the mode to HTTPS/download)`,
          true
        );
      }
      btn.disabled = false;
    }
  };
</script>
